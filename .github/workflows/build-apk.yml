name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java full version: $JAVA_VER"
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          JAVA_MAJOR=$(echo "$JAVA_VER" | awk -F '.' '{print ($1 == "1" ? $2 : $1)}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "Error: Failed to parse Java major version as integer."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi
          echo "Confirmed: Active Java major version $JAVA_MAJOR is 17 or newer."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "./debug.keystore is missing. Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore does not exist after generation attempt."
            exit 1
          fi
          echo "Confirmed: ./debug.keystore exists."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK was not found at: $EXPECTED_APK"
            echo "Searching discovered APKs inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is not a regular file."
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is empty."
            exit 1
          fi
          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "Error: $EXPECTED_APK does not have the .apk extension."
              exit 1
              ;;
          esac
          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Target is not exactly app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi
          echo "Confirmed: $EXPECTED_APK exists, is a non-empty regular file, and matches the expected path."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME=$(echo "${{ github.repository }}" | awk -F '/' '{print $2}')
          fi
          CLEAN_REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$CLEAN_REPO_NAME" ]; then
            CLEAN_REPO_NAME="android-app"
          fi
          RUN_NUM="${{ github.run_number }}"
          RELEASE_ASSET_NAME="${CLEAN_REPO_NAME}-debug-build-${RUN_NUM}.apk"
          RELEASE_DIR="${{ runner.temp }}/release_asset"
          mkdir -p "$RELEASE_DIR"
          RELEASE_ASSET_PATH="${RELEASE_DIR}/${RELEASE_ASSET_NAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$RELEASE_ASSET_PATH"
          if [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "Error: Release asset $RELEASE_ASSET_PATH is missing or empty."
            exit 1
          fi
          echo "asset_path=$RELEASE_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $RELEASE_ASSET_PATH (filename: $RELEASE_ASSET_NAME)"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          RELEASE_ASSET="${{ steps.prepare_release.outputs.asset_path }}"
          if [ ! -f "$RELEASE_ASSET" ]; then
            echo "Error: Release asset file does not exist at: $RELEASE_ASSET"
            exit 1
          fi
          if [ ! -s "$RELEASE_ASSET" ]; then
            echo "Error: Release asset file is empty: $RELEASE_ASSET"
            exit 1
          fi
          case "$RELEASE_ASSET" in
            *.apk) ;;
            *)
              echo "Error: Release asset does not have .apk extension: $RELEASE_ASSET"
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          cat << 'EOF' > release_notes.md
This is an automatically generated debug APK.
The APK was built by GitHub Actions.

Details:
- GitHub Actions Run Number: ${{ github.run_number }}
- GitHub Actions Run Attempt: ${{ github.run_attempt }}
- Source Commit SHA: ${{ github.sha }}

Notice:
- The APK is intended for testing.
- The APK is not a Play Store production release.
- The APK is signed only with a temporary debug keystore.
EOF

          echo "Publishing release with tag: $RELEASE_TAG, title: $RELEASE_TITLE..."
          gh release create "$RELEASE_TAG" "$RELEASE_ASSET" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            ASSET_NAME="${{ steps.prepare_release.outputs.asset_name }}"
            echo "GitHub Release publishing succeeded."
            gh release view "$RELEASE_TAG"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq .url)
            RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            {
              echo "## 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "The debug APK was successfully built and published to GitHub Releases."
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Title:** $RELEASE_TITLE"
              echo "- **Release Page:** [$RELEASE_URL]($RELEASE_URL)"
              echo "- **APK Filename:** \`$ASSET_NAME\`"
              echo ""
              echo "### 📱 How to Download on your Phone"
              echo "1. Open the GitHub Release page: [$RELEASE_URL]($RELEASE_URL)"
              echo "2. Under **Assets**, click or tap \`$ASSET_NAME\` to download the APK."
              echo ""
              echo "> **Backup Artifact:** The standard GitHub Actions artifact \`app-debug-apk\` is also available under the workflow run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was not reached."
            echo "The debug APK build succeeded and the artifact named 'app-debug-apk' remains available."
            {
              echo "## ⚠️ Debug APK Build Succeeded (Release Publishing Warning)"
              echo ""
              echo "> **Notice:** The debug APK was built and verified successfully, and the GitHub Actions artifact \`app-debug-apk\` is preserved and available."
              echo "> However, publishing to GitHub Releases encountered an issue or was skipped."
              echo ""
              echo "### 📦 Download Backup Artifact"
              echo "The compiled debug APK can be downloaded directly from the GitHub Actions **Artifacts** section on this workflow run page (\`app-debug-apk\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
